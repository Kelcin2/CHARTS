# Default values for ray-serve.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 80

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

securityContext:
  user: 1999
  fsGroup: 1999

deployment:
  configCopier:
    image: busybox
    imageTag: 1.37.0
  openclaw:
    image: ghcr.io/openclaw/openclaw
    imageTag: 2026.5.22
    tz: "Asia/Shanghai"
    configVolumeName: openclaw-config-volume
    configVolumePath: /mnt/host/d/openclaw
    storage: 40Gi
    resources:
      limits:
        cpu: 5
        memory: 10Gi
      requests:
        cpu: 2
        memory: 2Gi
    forceGenerateNewToken: false
    gatewayPort: 18789
    maxLoopRequests: 20
    extraEnvs:
      GOPASS_HOMEDIR: "/home/node/node/.config/.gopass"
    gopassDownloadUrl: "https://github.com/gopasspw/gopass/releases/download/v1.16.1/gopass-1.16.1-linux-amd64.tar.gz"
    gopassAgeDownloadUrl: "https://github.com/FiloSottile/age/releases/download/v1.3.1/age-v1.3.1-linux-amd64.tar.gz"
    gopassAgePassphrase:
    model:
      config:
        endpointId: Qwen
        baseUrl: https://dashscope.aliyuncs.com/compatible-mode/v1
        apiKey:
        apiKeyFetch:
          id: qwen/api-key
        modelId: qwen3.5-flash
        reasoning: true
        contextWindow: 900000
        maxTokens: 16384
