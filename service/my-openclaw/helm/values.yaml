# Default values for ray-serve.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 80

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

deployment:
  configCopier:
    image: busybox
    imageTag: 1.37.0
  openclaw:
    image: ghcr.io/openclaw/openclaw
    imageTag: 2026.3.12
    tz: "Asia/Shanghai"
    configVolumeName: openclaw-config-volume
    configVolumePath: /mnt/host/d/openclaw
    storage: 40Gi
    resources:
      limits:
        cpu: 5
        memory: 10Gi
      requests:
        cpu: 2
        memory: 2Gi
    generateNewToken: false
    gatewayPort: 18789
    model:
      config:
        endpointId: Qwen
        baseUrl: https://dashscope.aliyuncs.com/compatible-mode/v1
        apiKey: ""
        modelId: qwen3.5-flash
        reasoning: true
