{{- $endpointId:= .Values.deployment.openclaw.model.config.endpointId -}}
{{- $baseUrl:= .Values.deployment.openclaw.model.config.baseUrl -}}
{{- $apiKeyFetch:= .Values.deployment.openclaw.model.config.apiKeyFetch -}}
{{- $modelId:= .Values.deployment.openclaw.model.config.modelId -}}
{{- $maxLoopRequests:= .Values.deployment.openclaw.maxLoopRequests | int -}}
{{- if empty $endpointId -}}
{{- fail "deployment.openclaw.model.config.endpointId is required" -}}
{{- end -}}
{{- if empty $baseUrl -}}
{{- fail "deployment.openclaw.model.config.baseUrl is required" -}}
{{- end -}}
{{- if empty $apiKeyFetch -}}
{{- fail "deployment.openclaw.model.config.apiKeyFetch is required" -}}
{{- end -}}
{{- if empty $modelId -}}
{{- fail "deployment.openclaw.model.config.modelId is required" -}}
{{- end -}}
{{- if 0 | gt $maxLoopRequests | not -}}
{{- fail "deployment.openclaw.maxLoopRequests must greater than 0" -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-config-cm
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "my-openclaw.labels" . | nindent 4 }}
data:
  entrypoint: |-
    {{- tpl (.Files.Get "script/entrypoint.sh") (dict "id" .Values.deployment.openclaw.model.config.apiKeyFetch.id) | nindent 4 }}
  openclaw_config: |-
    {
      "secrets": {
        "providers": {
          "api-key": {
            "source": "exec",
            "command": "/home/node/node/bin/gopass",
            "args": ["show", "-o","{{ .Values.deployment.openclaw.model.config.apiKeyFetch.id }}"],
            "jsonOnly": false,
            "allowSymlinkCommand": true,
            "allowInsecurePath": true,
            "passEnv": [
              "PATH",
              "GOPASS_HOMEDIR",
              "GNUPGHOME"
            ]
          },
          "auth-token": {
            "source": "exec",
            "command": "/home/node/node/bin/gopass",
            "args": ["show", "-o","openclaw/auth-token"],
            "jsonOnly": false,
            "allowSymlinkCommand": true,
            "allowInsecurePath": true,
            "passEnv": [
              "PATH",
              "GOPASS_HOMEDIR",
              "GNUPGHOME"
            ]
          }
        }
      },
      "models": {
        "mode": "merge",
        "providers": {
          "{{ $endpointId }}": {
            "baseUrl": {{ $baseUrl | quote }},
            "apiKey": {
              "id": "value",
              "provider": "api-key",
              "source": "exec"
            },
            "api": "openai-completions",
            "models": [
              {
                "id": {{ $modelId | quote }},
                "name": {{ printf "%s (Custom Provider)" $modelId | quote }},
                "reasoning": {{ .Values.deployment.openclaw.model.config.reasoning }},
                "input": [
                  "text"
                ],
                "cost": {
                  "input": 0,
                  "output": 0,
                  "cacheRead": 0,
                  "cacheWrite": 0
                },
                "contextWindow": {{ .Values.deployment.openclaw.model.config.contextWindow }},
                "maxTokens": {{ .Values.deployment.openclaw.model.config.maxTokens }}
              }
            ]
          }
        }
      },
      "agents": {
        "defaults": {
          "model": {
            "primary": {{ printf "%s/%s" $endpointId $modelId | quote }}
          },
          "models": {
            {{ printf "%s/%s" $endpointId $modelId | quote }}: {
              "alias": {{ $modelId | quote }}
            }
          },
          "workspace": "~/.openclaw/workspace",
          "sandbox": {
            "mode": "off"
          },
          "heartbeat": {
            "every": "0m",
            "target": "last"
          }
        },
        "list": [
          {
            "id": "default",
            "name": "OpenClaw Assistant",
            "workspace": "~/.openclaw/workspace",
            "default": true
          }
    ]
      },
      "tools": {
        "profile": "coding",
        "loopDetection": {
          "enabled": true,
          "historySize": {{ $maxLoopRequests }},
          "warningThreshold": {{ $maxLoopRequests | mulf 0.6 | ceil | int }},
          "criticalThreshold": {{ $maxLoopRequests | mulf 0.8 | ceil | int }},
          "globalCircuitBreakerThreshold": {{ $maxLoopRequests }},
          "detectors": {
            "genericRepeat": true,
            "knownPollNoProgress": true,
            "pingPong": true
          }
        }
      },
      "commands": {
        "native": "auto",
        "nativeSkills": "auto",
        "restart": true,
        "ownerDisplay": "raw"
      },
      "session": {
        "dmScope": "per-channel-peer"
      },
      "hooks": {
        "internal": {
          "enabled": true,
          "entries": {
            "session-memory": {
              "enabled": true
            },
            "boot-md": {
              "enabled": true
            },
            "bootstrap-extra-files": {
              "enabled": true
            }
          }
        }
      },
      "gateway": {
        "port": {{ .Values.deployment.openclaw.gatewayPort }},
        "mode": "local",
        "bind": "lan",
        "controlUi": {
          "enabled": true,
          "allowedOrigins": [
            "http://localhost:{{ .Values.deployment.openclaw.gatewayPort }}",
            "http://127.0.0.1:{{ .Values.deployment.openclaw.gatewayPort }}"
          ]
        },
        "auth": {
          "mode": "token",
          "token": {
            "id": "value",
            "provider": "auth-token",
            "source": "exec"
          }
        },
        "tailscale": {
          "mode": "off",
          "resetOnExit": false
        },
        "nodes": {
          "denyCommands": [
            "camera.snap",
            "camera.clip",
            "screen.record",
            "contacts.add",
            "calendar.add",
            "reminders.add",
            "sms.send"
          ]
        }
      }
    }