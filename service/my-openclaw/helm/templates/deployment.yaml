apiVersion: apps/v1
kind: Deployment
metadata:
  name: openclaw
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "my-openclaw.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "my-openclaw.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "my-openclaw.labels" . | nindent 8 }}
    spec:
      serviceAccountName: openclaw-sa
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
      - name: config-copier
        image: {{ .Values.deployment.configCopier.image }}:{{ .Values.deployment.configCopier.imageTag }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command:
        - sh
        - -c
        - |
          mkdir -p /tmp/.openclaw
          test -f /tmp/.openclaw/openclaw.json || cp /tmp/config/openclaw.json /tmp/.openclaw/
          mkdir -p /tmp/app
          cp /tmp/config/entrypoint.sh /tmp/app/entrypoint.sh
          chmod 700 /tmp/app/entrypoint.sh
          chown 1000:1000 /tmp/app/entrypoint.sh
          chown 1000:1000 /tmp/.openclaw
          chown 1000:1000 /tmp/.openclaw/openclaw.json
          chmod 755 /tmp/.openclaw/openclaw.json
        volumeMounts:
        - name: openclaw-config
          mountPath: /tmp/config
          readOnly: true
        - name: entrypoint
          mountPath: /tmp/app
        - name: config
          mountPath: /tmp/.openclaw
          subPath: .openclaw
          readOnly: false
      containers:
      - name: openclaw
        image: {{ .Values.deployment.openclaw.image }}:{{ .Values.deployment.openclaw.imageTag }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        args:
          - "/app/entrypoint.sh"
        ports:
        - name: gateway-port
          containerPort: {{ .Values.deployment.openclaw.gatewayPort }}
          protocol: TCP
        startupProbe:
          httpGet:
            path: /healthz
            port: gateway-port
          initialDelaySeconds: 0
          timeoutSeconds: 1
          periodSeconds: 5
          failureThreshold: 60
        livenessProbe:
          httpGet:
            scheme: HTTP
            path: /healthz
            port: gateway-port
          initialDelaySeconds: 10
          timeoutSeconds: 1
          periodSeconds: 60
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            scheme: HTTP
            path: /readyz
            port: gateway-port
          initialDelaySeconds: 5
          timeoutSeconds: 1
          periodSeconds: 30
          successThreshold: 1
          failureThreshold: 3
        env:
        - name: TZ
          value: {{ .Values.deployment.openclaw.tz | quote }}
        - name: NPM_CONFIG_PREFIX
          value: "/home/node/node/node_global"
        - name: NPM_CONFIG_CACHE
          value: "/home/node/node/node_cache"
        - name: GOPASS_DOWNLOAD_URL
          value: {{ .Values.deployment.openclaw.gopassDownloadUrl | quote }}
        - name: GOPASS_AGE_DOWNLOAD_URL
          value: {{ .Values.deployment.openclaw.gopassAgeDownloadUrl | quote }}
        - name: GOPASS_AGE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: openclaw-secret
              key: _gopassAgePassphrase
        - name: PATH
          value: "/home/node/node/bin:/home/node/node/node_global/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
        {{- with .Values.deployment.openclaw.extraEnvs }}
        {{- range $key, $value := . }}
        - name: {{ $key }}
          value: {{ $value | quote }}
        {{- end }}
        {{- end }}
        resources:
          {{- toYaml .Values.deployment.openclaw.resources | nindent 10 }}
        volumeMounts:
        - name: entrypoint
          mountPath: /app/entrypoint.sh
          subPath: entrypoint.sh
        - name: config
          mountPath: /home/node/.openclaw
          subPath: .openclaw
          readOnly: false
        - name: config
          mountPath: /home/node/node
          subPath: node
          readOnly: false
        - name: config
          mountPath: /home/node/extraWorkspace
          subPath: extraWorkspace
          readOnly: false
      volumes:
      - name: entrypoint
        emptyDir: {}
      - name: config
        persistentVolumeClaim:
          claimName: {{ .Values.deployment.openclaw.configVolumeName }}
      - name: openclaw-config
        configMap:
          name: openclaw-config-cm
          items:
          - key: openclaw_config
            path: openclaw.json
          - key: entrypoint
            path: entrypoint.sh
            mode: 0744