# Default values for vllm-cpu.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
# fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
# runAsNonRoot: true
# runAsUser: 1000

service:
  type: NodePort
  port: 80

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80


tolerations: []

affinity: {}

deployment:
  vllm:
    image: kelcin-vllm-cpu-env
    imageTag: 2.0.0
    modelDir: Qwen2-0.5B-Instruct
    servedModelName: Qwen2-0.5B-Instruct
    useGPU: false
    gpuNum: 1
    args:
      - "--max-model-len"
      - "8192"
    vllmCpuKvcacheSpace: 4
    resources:
      limits:
        cpu: 8
        memory: 18Gi
      requests:
        cpu: 8
        memory: 15Gi
    configVolumeName: config-volume
    dataVolumeName: data-volume
    loggingVolumeName: logging-volume
    nodeSelector:
      kelcin-llm-server: "true"
    customChatTemplate: