deployment:
  vllm:
    image: kelcin-vllm-cpu-env
    imageTag: v0.7.3
    modelDir: DeepSeek-R1-Distill-Qwen-1.5B
    servedModelName: qwen
    args:
      - "--max-model-len"
      - "8192"
      - "--enable-reasoning"
      - "--reasoning-parser"
      - "deepseek_r1"
    vllmCpuKvcacheSpace: 4
    resources:
      limits:
        cpu: 8
        memory: 18Gi
      requests:
        cpu: 8
        memory: 15Gi
    customChatTemplate: "deepseek_qwen"