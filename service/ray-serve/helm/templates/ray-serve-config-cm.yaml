{{- $models := include "ray-serve.CalModelConfig" . | fromJsonArray -}}
{{- $maxOngoingRequests := .Values.deployment.rayServe.modelConfig.maxOngoingRequests -}}
{{- $logLevel := .Values.deployment.rayServe.modelConfig.logLevel -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: ray-serve-config-cm
  labels:
    {{- include "ray-serve.labels" . | nindent 4 }}
data:
  serve_config: |-
    proxy_location: EveryNode

    http_options:
      host: 0.0.0.0
      port: 8000

    logging_config:
      encoding: TEXT
      log_level: INFO
      logs_dir: null
      enable_access_log: true

    applications:
    - name: Health
      route_prefix: /health
      import_path: ray-serve:app_builder
      deployments:
      - name: Health
      args:
        type: Health
        health_name: Health
        app_num: {{ $models | len | quote }}
    {{- range $models }}
    - name: {{ .name }}
      route_prefix: /{{ .name }}
      import_path: ray-serve:app_builder
      deployments:
      - name: {{ .type }}
        max_ongoing_requests: {{ "maxOngoingRequests" | hasKey . | ternary .maxOngoingRequests $maxOngoingRequests }}
        logging_config:
          log_level: {{ "logLevel" | hasKey . | ternary .logLevel $logLevel }}
        ray_actor_options:
        {{- if "numGpus" | hasKey . }}
          num_gpus: {{ .numGpus }}
        {{- end }}
        {{- if "numCpus" | hasKey . }}
          num_cpus: {{ .numCpus }}
        {{- end }}
      args:
        type: {{ .type }}
        model_path: /models/{{ .name }}
    {{- end }}