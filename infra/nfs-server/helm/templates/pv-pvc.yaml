spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  volumeMode: Filesystem
  claimRef:
    name: pvc-nfs-server-ro
    namespace: {{ .Release.Namespace }}
  hostPath:
    path: /opt/nfs-storage/readOnly
