apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-nfs-server-load-kernel-modules
spec:
  resources:
    requests:
      storage: 500Mi
  accessModes:
    - ReadOnlyMany
  storageClassName: ""
  volumeMode: Filesystem
  volumeName: pv-nfs-server-load-kernel-modules
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-nfs-server-load-kernel-modules
spec:
  capacity:
    storage: 500Mi
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  volumeMode: Filesystem
  claimRef:
    name: pvc-nfs-server-load-kernel-modules
    namespace: {{ .Release.Namespace }}
  hostPath:
    path: /lib/modules
    type: Directory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-nfs-server-rw
spec:
  resources:
    requests:
      storage: 100Gi
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeMode: Filesystem
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-nfs-server-rw
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  volumeMode: Filesystem
  claimRef:
    name: pvc-nfs-server-rw
    namespace: {{ .Release.Namespace }}
  hostPath:
    path: /opt/nfs-storage/readWrite
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
