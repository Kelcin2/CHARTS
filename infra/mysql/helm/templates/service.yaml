apiVersion: v1
kind: Service
metadata:
  name: mysql-svc
  labels:
    {{- include "mysql.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: standard
      protocol: TCP
  selector:
    {{- include "mysql.selectorLabels" . | nindent 4 }}
    app: mysql
